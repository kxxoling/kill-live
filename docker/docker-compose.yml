services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
    ports:
      - "${APP_PORT:-3009}:3009"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    depends_on:
      - postgres
      - livekit
    networks:
      - kill-live-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kill-live
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kill-live-network

  livekit:
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
    environment:
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_RTC_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP:-false}
    entrypoint: ["sh", "-c"]
    command:
      - "/livekit-server --config /etc/livekit.yaml $${LIVEKIT_NODE_IP:+--node-ip $$LIVEKIT_NODE_IP}"
    volumes:
      - ${LIVEKIT_CONFIG:-./livekit.yaml}:/etc/livekit.yaml
    networks:
      - kill-live-network

volumes:
  postgres-data:

networks:
  kill-live-network:
    driver: bridge
