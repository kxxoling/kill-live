name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v20260816)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}

  update-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Prepend Docker image usage to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --json body --jq .body > notes.md 2>/dev/null; then
            echo "Release $TAG not found, skipping notes update."
            exit 0
          fi

          cat > image-notes.md <<'EOF'
          <!-- kill-live:image-notes:start -->
          ## Docker Image

          ```bash
          # 需要 PostgreSQL + LiveKit，完整配置见 README
          docker run -d -p 3009:3009 --env-file .env __IMAGE__
          ```
          <!-- kill-live:image-notes:end -->
          EOF
          sed -i "s|__IMAGE__|${IMAGE}:${TAG}|" image-notes.md

          sed -i -e '/<!-- kill-live:image-notes:start -->/,/<!-- kill-live:image-notes:end -->/d' -e '/./,$!d' notes.md

          {
            cat image-notes.md
            echo ""
            cat notes.md
          } > final-notes.md

          gh release edit "$TAG" --notes-file final-notes.md
